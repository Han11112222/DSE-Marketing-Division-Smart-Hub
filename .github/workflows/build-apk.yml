name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Install Flet
        run: pip install flet==0.24.1

      # ✅ 핵심 수정: --exclude-packages 로 numpy/pandas 제외
      - name: Build APK
        run: |
          flet build apk . \
            --project "SmartMarketingHub" \
            --org "com.marketing.hub" \
            --build-version "1.0.0" \
            --build-number 1 \
            --exclude-packages numpy,pandas,streamlit,openpyxl,certifi

      - name: Find APK
        run: find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartMarketingHub-APK
          path: build/apk/app-release.apk
          retention-days: 30
